<!DOCTYPE html>
<html>
<head>
  <title>Student ID</title>

  <style>
    body {
      background-color: #ecfdf5;
      font-family: Arial;
    }

    .card {
      width: 300px;
      margin: 80px auto;
      padding: 25px;

      background-color: white;

      border: 3px solid #059669;
      border-radius: 15px;
    }

    .photo {
      width: 80px;
      height: 80px;
      margin: auto;

      background-color: #d1fae5;

      border: 3px solid #10b981;
      border-radius: 50%;
    }

    h2 {
      text-align: center;
      color: #047857;
    }

    p {
      border-bottom: 1px solid #a7f3d0;
      padding: 8px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="photo"></div>

    <h2>Student ID</h2>

    <p>Name: Rahul Sharma</p>
    <p>Roll No: 101</p>
    <p>Class: Web Development</p>

  </div>

</body>
</html>
