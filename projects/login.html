<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      background-color: #f0f4ff;
      font-family: Arial;
    }

    .login {
      width: 320px;
      margin: 80px auto;
      padding: 30px;

      background-color: white;
      border: 2px solid #6366f1;
      border-radius: 12px;
    }

    h2 {
      text-align: center;
      color: #4338ca;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 10px 0;

      border: 2px solid #c7d2fe;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;

      background-color: #4f46e5;
      color: white;

      border: 2px solid #3730a3;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="login">
    <h2>Login</h2>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">

    <button>Login</button>
  </div>

</body>
</html>
