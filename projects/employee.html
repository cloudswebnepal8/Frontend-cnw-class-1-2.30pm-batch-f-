<!DOCTYPE html>
<html>
<head>
    <title>Employee Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Employee Details</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Position</th>
            <th>Salary</th>
        </tr>

        <tr><td>101</td><td>Ajay</td><td>Developer</td><td>50000</td></tr>
        <tr><td>102</td><td>Ram</td><td>Designer</td><td>45000</td></tr>
        <tr><td>103</td><td>Sita</td><td>Manager</td><td>70000</td></tr>
        <tr><td>104</td><td>Hari</td><td>Tester</td><td>40000</td></tr>
        <tr><td>105</td><td>Gita</td><td>HR</td><td>55000</td></tr>
        <tr><td>106</td><td>Ramesh</td><td>Developer</td><td>60000</td></tr>
    </table>

</body>
</html>
