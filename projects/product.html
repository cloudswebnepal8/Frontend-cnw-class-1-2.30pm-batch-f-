<!DOCTYPE html>
<html>
<head>
    <title>Product Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Product Price List</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
        </tr>

        <tr><td>1</td><td>Laptop</td><td>Electronics</td><td>85000</td></tr>
        <tr><td>2</td><td>Mouse</td><td>Accessories</td><td>1500</td></tr>
        <tr><td>3</td><td>Keyboard</td><td>Accessories</td><td>3000</td></tr>
        <tr><td>4</td><td>Mobile</td><td>Electronics</td><td>40000</td></tr>
        <tr><td>5</td><td>Headphone</td><td>Accessories</td><td>2500</td></tr>
        <tr><td>6</td><td>Monitor</td><td>Electronics</td><td>20000</td></tr>
    </table>

</body>
</html>
