<html>

<head>
    <title>Login form</title>
</head>

<body>
    <h2>
        Login Form
    </h2>
    <label>Full Name</label><br>
    <input type="text" placeholder="Enter your name"><br><br>

    <label>Email</label><br>
    <input type="email" placeholder="Enter your email"><br><br>

    <label>Password</label><br>
    <input type="password" placeholder="Enter your password"><br><br>

    <label>Gender</label>
    <input type="radio" name="gender" id="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>

    <button type="submit">Login</button>


    <!-- create an image from any online link and make sure it redirect to its page when user click on that image -->

    <a href="https://www.cloudsnepalweb.com.np/" target="_blank"><img
            src="https://www.cloudsnepalweb.com.np/assets/slider1-BZCT-ZIh.png"></a>


</body>

</html>
